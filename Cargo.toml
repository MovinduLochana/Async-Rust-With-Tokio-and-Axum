[package]
name = "Axum"
version = "0.1.0"
edition = "2024"

[dependencies]

# Tokio
tokio = { version = "1.52.1", features = ["macros", "rt-multi-thread", "signal"]}

# Axum
axum = { version = "0.8.9", features = ["macros"] }
tower-http = { version = "0.7.0", features = ["fs"]}
tower-cookies = "0.11.0" #should have used axum extra instead
uuid = { version = "1.23.4", features = ["v4"]}

# Serde
serde = {  version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_with = "3.21.0"
strum_macros = "0.28.0"

# Other
lazy-regex = "3.6.0" # compile regex once in comp time us

[profile.release]
debug = false
codegen-units = 1
opt-level = 3